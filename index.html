<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetris</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <h1>Tetris</h1>

    <div class="game-area">
      <div class="board-wrapper">
        <canvas id="board" width="300" height="600"></canvas>
        <div id="game-over-overlay" class="hidden">
          <p>Game Over</p>
          <button id="restart-btn">다시 시작</button>
        </div>
      </div>

      <div class="side-panel">
        <div class="panel-box">
          <h2>Score</h2>
          <p id="score">0</p>
        </div>

        <div class="panel-box">
          <h2>Level</h2>
          <p id="level">1</p>
        </div>

        <div class="panel-box">
          <h2>조작 방법</h2>
          <ul class="controls">
            <li>← → : 좌우 이동</li>
            <li>↓ : 소프트 드롭</li>
            <li>↑ : 회전</li>
            <li>Space : 하드 드롭</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
